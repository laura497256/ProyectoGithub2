name: CD - Produccion

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update-version:
    name: Incrementar version de la aplicacion
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Incrementar version y anadir fecha
        if: github.event_name == 'pull_request'
        run: |
          CURRENT=$(grep -E '^AppVersion-[0-9]+$' README.md | tail -n 1 | sed 's/AppVersion-//')
          if [ -z "$CURRENT" ]; then
            CURRENT=0
          fi
          NEXT=$((CURRENT + 1))

          sed -i '/^AppVersion-[0-9][0-9]*$/d' README.md
          printf '\nAppVersion-%s\nFecha: %s\n' "$NEXT" "$(date -u '+%Y-%m-%d %H:%M UTC')" >> README.md

          BRANCH="cd/actualizar-version"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add README.md
          git commit -m "chore: actualizar version a AppVersion-$NEXT"
          git push --force origin "$BRANCH"

      - name: Crear Pull Request de version
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr create \
            --base main \
            --head cd/actualizar-version \
            --title "chore: actualizar version" \
            --body "Actualizacion automatica de version y fecha." \
            || echo "La Pull Request ya existe o no se pudo crear."

  validate-prod-token:
    name: Validar token de produccion
    runs-on: self-hosted
    needs: update-version
    steps:
      - name: Comparar secreto y variable local
        shell: powershell
        env:
          PROD_TOKEN: ${{ secrets.PROD_TOKEN }}
        run: |
          if ([string]::IsNullOrEmpty($env:PROD_TOKEN)) {
            Write-Error "Falta PROD_TOKEN."
            exit 1
          }
          if ([string]::IsNullOrEmpty($env:LOCAL_PROD_TOKEN)) {
            Write-Error "Falta LOCAL_PROD_TOKEN."
            exit 1
          }
          if ($env:PROD_TOKEN -ceq $env:LOCAL_PROD_TOKEN) {
            Write-Host "Token de produccion validado."
          } else {
            Write-Error "Los tokens no coinciden."
            exit 1
          }