name: CD - Produccion

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  validate-prod-token:
    name: Validar token de produccion
    runs-on: self-hosted
    steps:
      - name: Comparar secreto y variable local
        shell: powershell
        env:
          PROD_TOKEN: ${{ secrets.PROD_TOKEN }}
        run: |
          if ([string]::IsNullOrEmpty($env:PROD_TOKEN)) {
            Write-Error "Falta el secreto PROD_TOKEN."
            exit 1
          }
          if ([string]::IsNullOrEmpty($env:LOCAL_PROD_TOKEN)) {
            Write-Error "Falta LOCAL_PROD_TOKEN en el runner."
            exit 1
          }
          if ($env:PROD_TOKEN -ceq $env:LOCAL_PROD_TOKEN) {
            Write-Host "Token de produccion validado correctamente."
          } else {
            Write-Error "Los tokens no coinciden."
            exit 1
          }
